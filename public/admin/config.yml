backend:
  name: github
  repo: DilloABoncio/dillo-a-boncio
  branch: main
  base_url: https://dillo-a-boncio.pages.dev
  auth_endpoint: api/auth

locale: 'it'
site_url: https://dillo-a-boncio.pages.dev
display_url: https://dillo-a-boncio.pages.dev
base_url: https://dillo-a-boncio.pages.dev
logo_url: https://dillo-a-boncio.pages.dev/images/logo.png

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "articoli"
    label: "Articoli"
    folder: "src/content/articoli"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Numero Episodio", name: "number", widget: "number"}
      - {label: "Titolo", name: "title", widget: "string"}
      - {label: "Durata", name: "duration", widget: "string", hint: "Es: 45 min"}
      - {label: "Data", name: "date", widget: "datetime"}
      - {label: "Immagine episodio", name: "thumbnail", widget: "image", required: false}
      - {label: "Link YouTube", name: "youtube", widget: "string", required: false}
      - {label: "Link Instagram", name: "instagram", widget: "string", required: false, hint: "Link al post Instagram dell'episodio"}
      - {label: "Descrizione", name: "body", widget: "markdown"}

  - name: "episodi"
    label: "Episodi Podcast"
    folder: "src/content/episodi"
    create: true
    slug: "{{number}}-{{slug}}"
    fields:
      - {label: "Numero Episodio", name: "number", widget: "number"}
      - {label: "Titolo", name: "title", widget: "string"}
      - {label: "Durata", name: "duration", widget: "string", hint: "Es: 45 min"}
      - {label: "Data", name: "date", widget: "datetime"}
      - {label: "Immagine di copertina", name: "thumbnail", widget: "image", required: false}
      - {label: "Link YouTube", name: "youtube", widget: "string", required: false}
      - {label: "Descrizione", name: "body", widget: "markdown"}
